chapter-id: ch-01
nodes:
  - id: 0
    type: PLAYER
    narrative-id: nar_01
    changes:
      - add($counter, 0)
      - set($aBool, true)
    branches:
      - prompt: take a sip
        node-id: sip_1
      - prompt: explore the kitchen
        node-id: explore_kitchen
  - id: sip_1
    type: AUTOMATIC
    narrative-id: sip_1
    changes:
      - set($a_string, "new_value")
    branches:
      - predicate-expression: '$a_string equals "some constant value"'
        node-id: 0_after_sip
        prompt: "hello, world"
      - predicate-expression: "1 equals 1"
        node-id: 0_after_sip
        prompt: "hello, world2"
  - id: 0_after_sip
    type: PLAYER
    narrative-id: empty_nar
    changes:
      - set($counter, 0)
    branches:
      - prompt: explore the kitchen
        node-id: explore_kitchen
  - id: explore_kitchen
    type: PLAYER
    narrative-id: explore_kitchen
    changes:
    branches:
      - prompt: take sip
        node-id: 0
